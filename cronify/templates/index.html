<!DOCTYPE html>
<html>
    <header>
        <title>
            Cronify - Dashboard
        </title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">  
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <link rel="stylesheet" href="/static/styles.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
        <script src="/static/main.js" defer></script>
    </header>
    <body>
        <div class="flex justify-between items-center relative z-10 mt-3 ml-3">
            <span class="text-xl font-semibold tracking-wider text-white flex items-center gap-2">
                <span class="border-t-2 border-l-2 border-r-2 border-white w-4 h-3 inline-block rounded-t-sm transform -rotate-45"></span>
                CRONIFY
            </span>
        </div>
        <div id="info-agents">
            <button onclick="toggle('visible')"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-plus-square-fill" viewBox="0 0 16 16">
  <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm6.5 4.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3a.5.5 0 0 1 1 0"/>
</svg></button>
            <h4 id="agents" class="text-white">connected agents : ?</h4>
        </div>
        <div id="cronify-form" style="visibility: hidden;">
            
            <form method="post">
                <h1 id="form-title">Create a cron job</h1>

                <input type="text" name="minute" placeholder="minute" id="minute">
                <input type="text" name="hour" placeholder="hour" id="hour">
                <input type="text" name="day" placeholder="day" id="day">
                <input type="text" name="month" placeholder="month" id="month">
                <input type="text" name="weekday" placeholder="weekday" id="weekday">
                <input type="text" name="command" placeholder="command" id="command">
                <button onclick="toggle()" id="submit">Submit</button>
            </form>
            <button id="close" onclick="toggle('hidden')"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-x-square" viewBox="0 0 16 16">
  <path d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
  <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
</svg></button>
        </div>
    </body>
</html>
