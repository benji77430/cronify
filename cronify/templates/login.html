<!DOCTYPE html>
<html lang="endif">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronify - Log In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/login.js"></script>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #2b2735; /* Outer shadow backdrop color */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-5xl bg-[#1e1b26] rounded-2xl overflow-hidden shadow-2xl border border-[#2e2a3a] flex flex-col md:flex-row min-h-[600px]">
        
        <div class="w-full md:w-[45%] bg-gradient-to-b from-[#43317c] to-[#120f1a] p-8 flex flex-col justify-between relative overflow-hidden min-h-[300px] md:min-h-auto">
            <div class="absolute inset-0 opacity-20 bg-cover bg-center mix-blend-overlay" style="background-image: url('https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=800&q=80');"></div>
            
            <div class="flex justify-between items-center relative z-10">
                <span class="text-xl font-semibold tracking-wider text-white flex items-center gap-1">
                    <span class="border-t-2 border-l-2 border-r-2 border-white w-4 h-3 inline-block rounded-t-sm transform -rotate-45"></span>
                    CRONIFY
                </span>
            </div>

            <div class="relative z-10 mt-auto">
                <h2 class="text-2xl font-light tracking-wide text-white leading-snug max-w-xs mb-4">
                    Automating Tasks,<br><span class="font-normal text-purple-300">Optimizing Performance</span>
                </h2>
            </div>
        </div>

        <div class="w-full md:w-[55%] p-8 md:p-14 flex flex-col justify-center">
            
            <div class="mb-8">
                <h1 class="text-3xl font-light text-white mb-2">Log in to your account</h1>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <div class="mb-4 p-3 rounded bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
                  {{ messages[0] }}
                </div>
              {% endif %}
            {% endwith %}

            <form action="/login" method="POST" class="space-y-4">
                
                <div>
                    <input type="text" name="username" placeholder="Username" required
                        class="w-full bg-[#25212f] text-white placeholder-gray-500 border border-[#373245] focus:border-[#7c66dc] focus:outline-none rounded-lg px-4 py-3.5 text-sm transition">
                </div>

                <div class="relative">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required
                        class="w-full bg-[#25212f] text-white placeholder-gray-500 border border-[#373245] focus:border-[#7c66dc] focus:outline-none rounded-lg px-4 py-3.5 text-sm transition pr-10">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3.5 text-gray-500 hover:text-gray-300 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                    </button>
                </div>

                <button type="submit" 
                    class="w-full bg-[#6d5dfb] hover:bg-[#5b4deb] text-white font-medium py-3.5 px-4 rounded-lg text-sm transition shadow-lg shadow-purple-900/20">
                    Log in
                </button>
            </form>
    </div>
</body>
</html>
